# .github/workflows/api-tests.yml
name: API Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'tests/postman/**'
      - 'docker-compose.yml'
      - '.github/workflows/api-tests.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'tests/postman/**'
      - 'docker-compose.yml'
      - '.github/workflows/api-tests.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - local
          - docker
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Обновлено до v4

      - name: Set up Docker Compose
        run: |
          docker compose version

      - name: Start services with Docker Compose
        run: |
          echo "Starting services defined in docker-compose.yml..."
          docker compose up -d
          
          echo "Waiting for services to be healthy..."
          timeout 300 bash -c 'until docker compose ps | grep -q "Up.*ago)"; do sleep 5; echo "Still waiting for services..."; done'
          echo "Services appear to be up. Waiting an additional 30 seconds for full startup..."
          sleep 30

      - name: Set up Node.js
        uses: actions/setup-node@v4 # Обновлено до v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: tests/postman/package-lock.json
      
      - name: Install Newman and dependencies
        working-directory: tests/postman
        run: npm ci

      - name: Run API tests (inside Docker network)
        working-directory: tests/postman
        run: |
          echo "Running API tests inside the Docker network..."
          
          FOLDER_ARG=""
          if [ -n "${{ github.event.inputs.test_folder }}" ]; then
            FOLDER_ARG="--folder '${{ github.event.inputs.test_folder }}'"
          fi
          
          ENV_ARG="--environment ${{ github.event.inputs.environment || 'docker' }}"
          
          NEWMAN_CMD="npx newman run CinemaAbyss.postman_collection.json $ENV_ARG $FOLDER_ARG -r cli,junit --reporter-junit-export './reports/junit-report.xml'"
          
          echo "Executing command: $NEWMAN_CMD"
          
          mkdir -p reports
          
          docker run --rm \
            --network cinemaabyss-network \
            -v "$(pwd):/etc/newman" \
            -w /etc/newman \
            node:18-alpine \
            sh -c "npm install newman newman-reporter-junit && $NEWMAN_CMD"

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4 # Обновлено до v4
        if: always()
        with:
          name: test-reports
          path: tests/postman/reports/
          retention-days: 30

      - name: Stop services
        if: always()
        run: |
          echo "Stopping Docker Compose services..."
          docker compose down -v